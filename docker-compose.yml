services:
  db:
    image: postgres:16-alpine
    container_name: customs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: customs
      POSTGRES_PASSWORD: customs_pass
      POSTGRES_DB: customs_accounting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs -d customs_accounting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: